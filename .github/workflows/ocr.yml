name: AdamOCR Processing

on:
  workflow_dispatch:
  push:
    paths:
      - 'input_pdfs/**'
      - 'ocr_script.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  process_ocr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCR Script
        run: python ocr_script.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "AdamOCR Bot"
          git config --global user.email "bot@adamocr.local"
          git add results/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update OCR results"
          git push